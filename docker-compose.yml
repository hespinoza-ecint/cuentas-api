services:
  api:
    build: .
    container_name: cuentas-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    environment:
      # La base vive en el volumen persistente, fuera del contenedor.
      DATABASE_URL: file:/data/cuentas.db
    volumes:
      - cuentas-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cuentas-data:
